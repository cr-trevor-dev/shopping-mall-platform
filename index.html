<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">商城</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #222;
      padding-bottom: 80px;
    }

    .header {
      background: linear-gradient(135deg, #ff5a36, #ff7a35);
      padding: 18px 16px 22px;
      color: white;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      white-space: nowrap;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .message-btn {
      font-size: 14px;
      white-space: nowrap;
    }

    .language-select {
      border: 1px solid rgba(255,255,255,0.6);
      background: rgba(255,255,255,0.14);
      color: white;
      border-radius: 18px;
      padding: 7px 10px;
      font-size: 13px;
      outline: none;
    }

    .language-select option {
      color: #222;
      background: white;
    }

    .search-box {
      background: white;
      border-radius: 24px;
      display: flex;
      align-items: center;
      padding: 11px 16px;
      color: #999;
    }

    .search-box input {
      border: none;
      outline: none;
      width: 100%;
      font-size: 15px;
      margin-left: 8px;
      background: transparent;
    }

    .container {
      max-width: 800px;
      margin: auto;
    }

    .category-section {
      background: white;
      padding: 20px 10px;
      margin-bottom: 10px;
    }

    .section-title {
      padding: 0 8px;
      margin-bottom: 16px;
      font-size: 18px;
      font-weight: 700;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 18px 6px;
    }

    .category {
      text-align: center;
      font-size: 13px;
      cursor: pointer;
    }

    .category-icon {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      margin: 0 auto 7px;
      background: #fff1ec;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 27px;
    }

    .promotion {
      margin: 10px;
      padding: 20px;
      border-radius: 18px;
      color: white;
      background: linear-gradient(135deg, #ff3f32, #ff8b35);
    }

    .promotion h2 {
      font-size: 22px;
      margin-bottom: 5px;
    }

    .promotion p {
      font-size: 14px;
      opacity: 0.95;
    }

    .products-section {
      padding: 10px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .product {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
    }

    .product-image {
      height: 170px;
      background: #eee;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 60px;
    }

    .discount {
      position: absolute;
      top: 8px;
      left: 8px;
      background: #ff3b30;
      color: white;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
    }

    .product-info {
      padding: 11px;
    }

    .product-name {
      font-size: 15px;
      line-height: 1.4;
      margin-bottom: 7px;
    }

    .expiry {
      color: #888;
      font-size: 11px;
      margin-bottom: 8px;
    }

    .price {
      color: #f04432;
      font-size: 19px;
      font-weight: 800;
    }

    .old-price {
      color: #aaa;
      font-size: 12px;
      text-decoration: line-through;
      margin-left: 5px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 68px;
      background: white;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: space-around;
      z-index: 100;
    }

    .nav-item {
      width: 20%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 11px;
      color: #777;
      text-align: center;
    }

    .nav-icon {
      font-size: 22px;
      margin-bottom: 3px;
    }

    .nav-item.active {
      color: #ff572f;
      font-weight: 600;
    }

    @media (min-width: 700px) {
      .product-image {
        height: 240px;
      }
    }

    @media (max-width: 390px) {
      .language-select {
        max-width: 92px;
        padding: 6px 8px;
        font-size: 12px;
      }

      .message-btn {
        display: none;
      }
    }
  </style>
</head>

<body>

    <header class="header">
      <div class="header-top">
        <div class="logo" data-i18n="mall">商城</div>

        <div class="header-right">

          <select
            id="languageSelect"

            onchange="changeLanguage(this.value)"

            <option value="en">English</option>

      <div class="search-box">

        </div>

        </div>

        </div>

        <div class="category">

          <span data-i18n="digital">数码</span>
        </div>

        <div class="category">
          <div class="category-icon">🧴</div>
          <span data-i18n="daily">日用品</span>
        </div>

        <div class="category">
          <div class="category-icon">💄</div>
          <span data-i18n="beauty">美妆</span>
        </div>

        <div class="category">
          <div class="category-icon">👟</div>
          <span data-i18n="shoes">鞋包</span>
        </div>

        <div class="category">
          <div class="category-icon">🏠</div>
          <span data-i18n="home">家居</span>
        </div>

        <div class="category">
          <div class="category-icon">•••</div>
          <span data-i18n="all">全部</span>
        </div>

      </div>
    </section>

    <section class="promotion">
      <h2 data-i18n="limitedOffer">限时特惠</h2>
      <p data-i18n="dailyDeals">精选商品 · 每日优惠</p>
    </section>

    <section class="products-section">

          <div class="product-info">

            </div>

            <div class="expiry">

            </div>

            <span class="price">K 8,000</span>
            <span class="old-price">K 10,000</span>
          </div>
        </div>

        <div
          class="product"
          data-search-zh="薯片休闲零食"
          data-search-en="potato chips snack"
          data-search-my="အာလူးကြော် အဆာပြေ"
          data-search-th="มันฝรั่งทอด ขนม"
        >
          <div class="discount" data-i18n="specialPrice">特价</div>
          <div class="product-image">🍟</div>

          <div class="product-info">
            <div class="product-name" data-i18n="productChips">

            </div>

            <div class="expiry">
              <span data-i18n="expiry">保质期至</span>：2027-01-15
            </div>

            <span class="price">K 3,500</span>
            <span class="old-price">K 4,500</span>
          </div>
        </div>

        <div
          class="product"
          data-search-zh="现代简约沙发家具"
          data-search-en="modern sofa furniture"
          data-search-my="ခေတ်မီ ဆိုဖာ ပရိဘောဂ"
          data-search-th="โซฟา เฟอร์นิเจอร์"
        >
          <div class="product-image">🛋️</div>

          <div class="product-info">
            <div class="product-name" data-i18n="productSofa">
              现代简约沙发
            </div>

            <span class="price">K 680,000</span>
          </div>
        </div>

        <div
          class="product"
          data-search-zh="无线蓝牙耳机数码"
          data-search-en="wireless bluetooth headphones"
          data-search-my="ကြိုးမဲ့ ဘလူးတုသ် နားကြပ်"
          data-search-th="หูฟังบลูทูธไร้สาย"
        >
          <div class="discount" data-i18n="discount10">9折</div>
          <div class="product-image">🎧</div>

          <div class="product-info">
            <div class="product-name" data-i18n="productHeadphones">
              无线蓝牙耳机
            </div>

            <span class="price">K 45,000</span>
            <span class="old-price">K 50,000</span>
          </div>
        </div>

      </div>

    </section>

  </div>

  <nav class="bottom-nav">

    <div class="nav-item active">
      <div class="nav-icon">🏠</div>
      <span data-i18n="navHome">首页</span>
    </div>

    <div class="nav-item">
      <div class="nav-icon">▦</div>
      <span data-i18n="navCategories">分类</span>
    </div>

    <div class="nav-item">
      <div class="nav-icon">🛒</div>
      <span data-i18n="cart">购物车</span>
    </div>

    <div class="nav-item">
      <div class="nav-icon">💬</div>
      <span data-i18n="messages">消息</span>
    </div>

    <div class="nav-item">
      <div class="nav-icon">👤</div>
      <span data-i18n="mine">我的</span>
    </div>

  </nav>

      en: {

        drinks: "Drinks",

        dailyDeals: "Selected products · Daily deals",
        recommended: "Recommended",
        discount20: "20% OFF",
        discount10: "10% OFF",
        specialPrice: "Special",
        productChocolate: "Imported Chocolate Snacks",
        productChips: "Potato Chips",
        productSofa: "Modern Minimalist Sofa",
        productHeadphones: "Wireless Bluetooth Headphones",
        expiry: "Expiry",
        navHome: "Home",
        navCategories: "Categories",

      my: {
        pageTitle: "စျေးဝယ်စင်တာ",
        mall: "စျေးဝယ်စင်တာ",
        messages: "စာများ",
        searchPlaceholder: "ပစ္စည်း၊ အဆာပြေ၊ ပရိဘောဂ ရှာရန်...",

        digital: "အီလက်ထရွန်းနစ်",
        daily: "နေ့စဉ်သုံးပစ္စည်း",

        all: "အားလုံး",
        limitedOffer: "အချိန်ကန့်သတ် လျှော့ဈေး",
        dailyDeals: "ရွေးချယ်ထားသော ပစ္စည်းများ · နေ့စဉ်လျှော့ဈေး",
        recommended: "သင့်အတွက်",

      th: {

        mall: "ศูนย์การค้า",
        messages: "ข้อความ",
        searchPlaceholder: "ค้นหาสินค้า ขนม เฟอร์นิเจอร์...",

        beauty: "ความงาม",
        shoes: "รองเท้าและกระเป๋า",
        home: "ของใช้ในบ้าน",
        all: "ทั้งหมด",
        limitedOffer: "โปรโมชั่นจำกัดเวลา",
        dailyDeals: "สินค้าคัดสรร · โปรรายวัน",

        discount20: "ลด 20%",
        discount10: "ลด 10%",
        specialPrice: "ราคาพิเศษ",
        productChocolate: "ช็อกโกแลตนำเข้า",
        productChips: "มันฝรั่งทอด",
        productSofa: "โซฟาสไตล์โมเดิร์น",

        navHome: "หน้าแรก",
        navCategories: "หมวดหมู่",
        cart: "รถเข็น",
        mine: "ของฉัน"
      }
    };

    let currentLanguage = "zh";

    function changeLanguage(language) {
      currentLanguage = language;

      const t = translations[language];

      document.documentElement.lang = language;

      document.querySelectorAll("[data-i18n]").forEach(function(element) {
        const key = element.getAttribute("data-i18n");

        if (t[key]) {
          element.textContent = t[key];
        }
      });

      document.getElementById("searchInput").placeholder =
        t.searchPlaceholder;

      document.title = t.pageTitle;

      localStorage.setItem("mallLanguage", language);

      searchProducts();
    }

    function searchProducts() {
      const keyword =
        document
          .getElementById("searchInput")
          .value
          .trim()
          .toLowerCase();

      const products =
        document.querySelectorAll(".product");

      products.forEach(function(product) {
        const searchText =
          (
            product.getAttribute("data-search-" + currentLanguage) ||
            product.getAttribute("data-search-zh") ||
            ""
          ).toLowerCase();

        if (searchText.includes(keyword)) {
          product.style.display = "block";
        } else {
          product.style.display = "none";
        }
      });
    }

    document.addEventListener("DOMContentLoaded", function() {
      const savedLanguage =
        localStorage.getItem("mallLanguage") || "zh";

      document.getElementById("languageSelect").value =
        savedLanguage;

      changeLanguage(savedLanguage);
    });
  </script>

</body>
</html>
