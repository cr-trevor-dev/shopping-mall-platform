<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF9F1">
<title>SnacksHub · 零食商城</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#FFF9F1;
  --card:#FFFFFF;
  --soft:#FFF3E4;
  --orange:#F47B35;
  --orange-dark:#D96525;
  --text:#35251D;
  --muted:#8B776C;
  --line:#EEDFD2;
  --green:#4F8A62;
  --green-soft:#EAF4ED;
  --red:#B42318;
  --red-soft:#FEECE8;
  --amber:#9A6700;
  --amber-soft:#FFF5DF;
  --gray:#667085;
  --gray-soft:#F2F4F7;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  padding-bottom:84px;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "PingFang SC",
    "Microsoft YaHei",
    sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

img{
  display:block;
  max-width:100%;
}

a{
  color:inherit;
}

.hidden{
  display:none!important;
}

.no-scroll{
  overflow:hidden;
}

/* ==============================
   TOP
============================== */

.topbar{
  position:sticky;
  top:0;
  z-index:40;
  background:
    rgba(255,249,241,.94);
  backdrop-filter:
    blur(16px);
  border-bottom:
    1px solid
    rgba(238,223,210,.85);
}

.top-main{
  max-width:1180px;
  margin:0 auto;
  min-height:60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:8px 14px;
}

.logo{
  display:flex;
  flex-direction:column;
  min-width:0;
}

.logo-main{
  font-size:20px;
  font-weight:1000;
  letter-spacing:-.02em;
}

.logo-main span{
  color:var(--orange);
}

.logo-sub{
  margin-top:1px;
  color:var(--muted);
  font-size:9px;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:6px;
}

.icon-button{
  position:relative;
  min-width:39px;
  height:39px;
  border:1px solid var(--line);
  border-radius:12px;
  background:white;
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}

.cart-badge{
  position:absolute;
  right:-5px;
  top:-6px;
  min-width:18px;
  height:18px;
  padding:0 5px;
  border-radius:999px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--orange);
  color:white;
  font-size:9px;
  font-weight:900;
  border:2px solid var(--bg);
}

.language-select{
  width:auto;
  height:39px;
  border:1px solid var(--line);
  border-radius:12px;
  padding:0 8px;
  background:white;
  color:var(--text);
  font-weight:800;
  font-size:11px;
}

/* ==============================
   MAIN
============================== */

.container{
  width:100%;
  max-width:1180px;
  margin:0 auto;
  padding:14px;
}

.view{
  display:none;
}

.view.active{
  display:block;
}

.section-title-row{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:12px;
  margin:22px 0 11px;
}

.section-title{
  font-size:20px;
  font-weight:1000;
}

.section-subtitle{
  margin-top:3px;
  color:var(--muted);
  font-size:11px;
}

.link-button{
  padding:0;
  border:0;
  background:transparent;
  color:var(--orange);
  font-weight:900;
  font-size:11px;
}

/* ==============================
   REGION
============================== */

.region-strip{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:3px;
  scrollbar-width:none;
}

.region-strip::-webkit-scrollbar{
  display:none;
}

.region-pill{
  flex:none;
  border:1px solid var(--line);
  border-radius:999px;
  background:white;
  padding:9px 13px;
  font-size:11px;
  font-weight:900;
  white-space:nowrap;
}

.region-pill.active{
  color:white;
  background:var(--orange);
  border-color:var(--orange);
}

/* ==============================
   HERO
============================== */

.hero{
  overflow:hidden;
  position:relative;
  min-height:215px;
  margin-top:12px;
  padding:27px 23px;
  border-radius:24px;
  background:
    linear-gradient(
      135deg,
      #FFE7D3,
      #FFF8ED
    );
  border:1px solid #F5DCC7;
}

.hero:after{
  content:"🍪";
  position:absolute;
  right:-8px;
  bottom:-38px;
  font-size:155px;
  transform:rotate(-12deg);
  opacity:.14;
}

.hero-kicker{
  position:relative;
  z-index:2;
  color:var(--orange);
  font-size:11px;
  font-weight:1000;
  letter-spacing:.05em;
}

.hero-title{
  position:relative;
  z-index:2;
  max-width:530px;
  margin-top:8px;
  font-size:31px;
  line-height:1.12;
  font-weight:1000;
  letter-spacing:-.035em;
}

.hero-text{
  position:relative;
  z-index:2;
  max-width:470px;
  margin-top:10px;
  color:#705E52;
  font-size:13px;
  line-height:1.65;
}

.hero-actions{
  position:relative;
  z-index:2;
  display:flex;
  gap:8px;
  margin-top:17px;
}

/* ==============================
   BUTTON
============================== */

.btn{
  border:0;
  border-radius:12px;
  padding:11px 15px;
  font-weight:900;
}

.btn-small{
  padding:8px 10px;
  font-size:11px;
}

.btn-primary{
  background:var(--orange);
  color:white;
}

.btn-light{
  background:#F5EEE8;
  color:var(--text);
}

.btn-green{
  background:var(--green-soft);
  color:#2F6A42;
}

.btn-red{
  background:var(--red-soft);
  color:var(--red);
}

.btn-amber{
  background:var(--amber-soft);
  color:var(--amber);
}

.btn-block{
  width:100%;
}

/* ==============================
   SEARCH
============================== */

.search-box{
  display:flex;
  align-items:center;
  gap:8px;
  width:100%;
  padding:10px 12px;
  margin-top:13px;
  border:1px solid var(--line);
  border-radius:15px;
  background:white;
}

.search-box span{
  font-size:17px;
}

.search-box input{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
}

/* ==============================
   CATEGORY
============================== */

.category-grid{
  display:grid;
  grid-template-columns:
    repeat(5,minmax(0,1fr));
  gap:9px;
}

.category-card{
  min-width:0;
  padding:13px 9px;
  border:1px solid var(--line);
  border-radius:16px;
  background:white;
  text-align:center;
  cursor:pointer;
}

.category-card:hover{
  border-color:#E8BE9E;
}

.category-icon{
  font-size:29px;
  line-height:1;
}

.category-name{
  margin-top:8px;
  font-size:11px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.category-card.active{
  background:var(--soft);
  border-color:var(--orange);
  color:var(--orange);
}

/* ==============================
   PRODUCTS
============================== */

.product-grid{
  display:grid;
  grid-template-columns:
    repeat(4,minmax(0,1fr));
  gap:11px;
}

.product-card{
  overflow:hidden;
  min-width:0;
  border:1px solid var(--line);
  border-radius:18px;
  background:white;
}

.product-image-wrap{
  position:relative;
  aspect-ratio:1/1;
  background:
    linear-gradient(
      145deg,
      #FFF1E6,
      #FFF9F1
    );
  overflow:hidden;
}

.product-image{
  width:100%;
  height:100%;
  object-fit:cover;
}

.product-placeholder{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:62px;
}

.featured-tag{
  position:absolute;
  top:9px;
  left:9px;
  padding:5px 7px;
  border-radius:999px;
  color:white;
  background:var(--orange);
  font-size:9px;
  font-weight:1000;
}

.stock-tag{
  position:absolute;
  right:9px;
  bottom:9px;
  padding:5px 7px;
  border-radius:999px;
  color:#2F6A42;
  background:
    rgba(234,244,237,.96);
  font-size:9px;
  font-weight:1000;
}

.stock-tag.out{
  color:var(--red);
  background:
    rgba(254,236,232,.96);
}

.product-body{
  padding:12px;
}

.product-brand{
  color:var(--muted);
  font-size:9px;
  min-height:13px;
}

.product-name{
  margin-top:3px;
  min-height:38px;
  font-size:13px;
  font-weight:900;
  line-height:1.4;
}

.product-price{
  margin-top:8px;
  color:var(--orange);
  font-size:15px;
  font-weight:1000;
}

.product-wholesale{
  margin-top:2px;
  color:var(--green);
  font-size:9px;
  font-weight:800;
}

.product-actions{
  display:grid;
  grid-template-columns:1fr auto;
  gap:7px;
  margin-top:10px;
}

/* ==============================
   PRODUCT DETAIL
============================== */

.back-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:12px;
}

.back-btn{
  width:38px;
  height:38px;
  border:1px solid var(--line);
  border-radius:12px;
  background:white;
  font-size:18px;
}

.detail-grid{
  display:grid;
  grid-template-columns:
    minmax(0,1fr)
    minmax(0,1fr);
  gap:18px;
}

.detail-image{
  overflow:hidden;
  aspect-ratio:1/1;
  border:1px solid var(--line);
  border-radius:21px;
  background:white;
}

.detail-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.detail-placeholder{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    linear-gradient(
      145deg,
      #FFF0E2,
      #FFF9F1
    );
  font-size:100px;
}

.detail-info{
  background:white;
  border:1px solid var(--line);
  border-radius:21px;
  padding:19px;
}

.detail-brand{
  color:var(--muted);
  font-size:11px;
}

.detail-title{
  margin-top:5px;
  font-size:25px;
  line-height:1.25;
  font-weight:1000;
}

.detail-description{
  margin-top:9px;
  color:var(--muted);
  font-size:12px;
  line-height:1.7;
}

.variant-list{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:14px;
}

.variant-chip{
  padding:9px 10px;
  border:1px solid var(--line);
  border-radius:11px;
  background:white;
  font-size:11px;
  font-weight:900;
}

.variant-chip.active{
  border-color:var(--orange);
  background:#FFF4EC;
  color:var(--orange);
}

.purchase-mode{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:15px;
}

.mode-card{
  padding:12px;
  border:1px solid var(--line);
  border-radius:12px;
  background:white;
  cursor:pointer;
}

.mode-card.active{
  border-color:var(--orange);
  background:#FFF8F2;
}

.mode-title{
  font-size:11px;
  font-weight:900;
}

.mode-price{
  margin-top:4px;
  font-size:16px;
  font-weight:1000;
  color:var(--orange);
}

.mode-note{
  margin-top:3px;
  color:var(--muted);
  font-size:9px;
}

.qty-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-top:15px;
}

.qty-control{
  display:flex;
  align-items:center;
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden;
}

.qty-control button{
  width:38px;
  height:38px;
  border:0;
  background:#FFF8F2;
  font-size:17px;
}

.qty-control span{
  min-width:44px;
  text-align:center;
  font-weight:900;
}

/* ==============================
   CART
============================== */

.cart-layout{
  display:grid;
  grid-template-columns:
    minmax(0,1fr)
    310px;
  gap:14px;
}

.cart-list{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.cart-item{
  display:grid;
  grid-template-columns:
    76px
    minmax(0,1fr);
  gap:11px;
  padding:11px;
  background:white;
  border:1px solid var(--line);
  border-radius:16px;
}

.cart-thumb{
  width:76px;
  height:76px;
  border-radius:12px;
  overflow:hidden;
  background:#FFF3E8;
}

.cart-thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.cart-thumb-placeholder{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:35px;
}

.cart-name{
  font-size:12px;
  font-weight:900;
}

.cart-meta{
  margin-top:3px;
  color:var(--muted);
  font-size:9px;
}

.cart-line{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:8px;
  margin-top:9px;
}

.cart-price{
  color:var(--orange);
  font-size:13px;
  font-weight:1000;
}

.mini-qty{
  display:flex;
  align-items:center;
  gap:6px;
}

.mini-qty button{
  width:28px;
  height:28px;
  padding:0;
  border:1px solid var(--line);
  border-radius:8px;
  background:white;
}

.remove-btn{
  margin-left:5px;
  border:0;
  background:transparent;
  color:var(--red);
  font-size:10px;
}

.summary-card{
  position:sticky;
  top:76px;
  height:max-content;
  padding:16px;
  border:1px solid var(--line);
  border-radius:17px;
  background:white;
}

.summary-title{
  font-size:16px;
  font-weight:1000;
}

.summary-line{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:9px 0;
  border-bottom:1px solid #F5EAE2;
  font-size:11px;
}

.summary-total{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:13px 0;
  font-size:14px;
  font-weight:1000;
}

/* ==============================
   FORM
============================== */

.form-card{
  padding:16px;
  margin-bottom:12px;
  border:1px solid var(--line);
  border-radius:17px;
  background:white;
}

.form-title{
  margin-bottom:12px;
  font-size:16px;
  font-weight:1000;
}

.form-grid{
  display:grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));
  gap:10px;
}

.form-group{
  margin-bottom:11px;
}

.form-group label{
  display:block;
  margin-bottom:6px;
  font-size:11px;
  font-weight:900;
}

input,
select,
textarea{
  width:100%;
  border:1px solid var(--line);
  border-radius:11px;
  padding:11px;
  background:white;
  color:var(--text);
  outline:0;
}

textarea{
  min-height:85px;
  resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--orange);
  box-shadow:
    0 0 0 3px
    rgba(244,123,53,.1);
}

/* ==============================
   ADDRESS
============================== */

.address-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.address-card{
  padding:13px;
  border:1px solid var(--line);
  border-radius:13px;
  background:white;
  cursor:pointer;
}

.address-card.selected{
  border-color:var(--orange);
  background:#FFF8F2;
}

.address-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.address-name{
  font-size:12px;
  font-weight:900;
}

.address-detail{
  margin-top:5px;
  color:var(--muted);
  font-size:10px;
  line-height:1.6;
}

.default-badge{
  padding:4px 6px;
  border-radius:999px;
  background:var(--green-soft);
  color:var(--green);
  font-size:8px;
  font-weight:900;
}

/* ==============================
   AUTH MODAL
============================== */

.overlay{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  background:
    rgba(28,20,15,.5);
}

.modal{
  width:100%;
  max-width:470px;
  max-height:90vh;
  overflow:auto;
  padding:19px;
  border-radius:20px;
  background:white;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:13px;
}

.modal-title{
  font-size:19px;
  font-weight:1000;
}

.close-btn{
  width:34px;
  height:34px;
  border:0;
  border-radius:10px;
  background:#F5EEE8;
  font-size:18px;
}

.auth-tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-bottom:13px;
}

.auth-tab{
  padding:9px;
  border:1px solid var(--line);
  border-radius:11px;
  background:white;
  font-weight:900;
  font-size:11px;
}

.auth-tab.active{
  border-color:var(--orange);
  color:var(--orange);
  background:#FFF8F2;
}

.notice{
  margin-bottom:12px;
  padding:11px 12px;
  border-radius:11px;
  background:var(--amber-soft);
  color:#72510B;
  font-size:10px;
  line-height:1.6;
}

/* ==============================
   ACCOUNT / ORDERS
============================== */

.account-hero{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:17px;
  margin-bottom:12px;
  background:white;
  border:1px solid var(--line);
  border-radius:17px;
}

.avatar{
  width:52px;
  height:52px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:var(--soft);
  font-size:23px;
}

.account-name{
  font-size:17px;
  font-weight:1000;
}

.account-phone{
  margin-top:3px;
  color:var(--muted);
  font-size:10px;
}

.order-list{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.order-card{
  padding:14px;
  background:white;
  border:1px solid var(--line);
  border-radius:16px;
}

.order-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:9px;
}

.order-number{
  font-size:12px;
  font-weight:1000;
}

.order-time{
  margin-top:3px;
  color:var(--muted);
  font-size:9px;
}

.status-row{
  display:flex;
  flex-wrap:wrap;
  gap:4px;
}

.badge{
  display:inline-block;
  padding:4px 7px;
  border-radius:999px;
  background:var(--gray-soft);
  color:var(--gray);
  font-size:9px;
  font-weight:900;
}

.badge-green{
  background:var(--green-soft);
  color:#2F6A42;
}

.badge-red{
  background:var(--red-soft);
  color:var(--red);
}

.badge-amber{
  background:var(--amber-soft);
  color:var(--amber);
}

.order-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-top:11px;
}

.order-total{
  font-size:14px;
  font-weight:1000;
  color:var(--orange);
}

.order-actions{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

/* ==============================
   ORDER DETAIL
============================== */

.timeline{
  position:relative;
  display:flex;
  flex-direction:column;
  gap:0;
}

.timeline-item{
  position:relative;
  display:grid;
  grid-template-columns:
    24px
    minmax(0,1fr);
  gap:9px;
}

.timeline-marker{
  position:relative;
  display:flex;
  justify-content:center;
}

.timeline-dot{
  z-index:2;
  width:11px;
  height:11px;
  margin-top:4px;
  border-radius:50%;
  background:var(--orange);
  box-shadow:

}

.timeline-marker:after{

  position:absolute;
  top:15px;
  bottom:-5px;
  width:2px;
  background:#F1DED0;
}

.timeline-item:last-child

  display:none;
}

.timeline-body{

}

.timeline-status{

}

.timeline-note{

  bottom:0;
  z-index:50;
  width:100%;
  max-width:760px;
  transform:translateX(-50%);
  display:grid;
  grid-template-columns:

  padding:

.nav-item{

.nav-icon{

function t(key){

  return (
    i18n[
      appLanguage
    ]?.[key]
    ||
    i18n.zh[key]
    ||
    key
  );

}


function changeLanguage(lang){

  appLanguage =
    lang;

  localStorage.setItem(
    "mallLanguage",
    lang
  );

  rebuildMaps();

  applyLanguage();

  renderAll();

}


function applyLanguage(){

  document.documentElement.lang =
    appLanguage === "zh"
    ?
    "zh-CN"
    :
    appLanguage;


  document
    .querySelectorAll(
      "[data-i18n]"
    )
    .forEach(
      node => {

        const key =
          node.getAttribute(
            "data-i18n"
          );

        node.textContent =
          t(key);

      }
    );


  document
    .querySelectorAll(
      "[data-i18n-placeholder]"
    )
    .forEach(
      node => {

        const key =
          node.getAttribute(
            "data-i18n-placeholder"
          );

        node.placeholder =
          t(key);

      }
    );


  el("languageSelect").value =
    appLanguage;

}


/* ==========================================================
   HELPERS
========================================================== */

function el(id){

  return document
    .getElementById(id);

}


function escapeHtml(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      char => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      })[char]
    );

}


function money(
  value,
  currency = "MMK"
){

  return (
    new Intl.NumberFormat(
      "en-US",
      {
        maximumFractionDigits:0
      }
    )
    .format(
      Number(value || 0)
    )
    +
    " "
    +
    (
      currency
      ||
      "MMK"
    )
  );

}


function formatDate(value){

  if(!value){
    return "—";
  }

  return new Date(value)
    .toLocaleString(
      appLanguage === "zh"
      ?
      "zh-CN"
      :
      "en-US",
      {
        hour12:false
      }
    );

}


function statusBadge(status){

  const value =
    String(status || "—");


  const green = [
    "active",
    "confirmed",
    "paid",
    "completed",
    "fulfilled",
    "delivered",
    "approved",
    "processed"
  ];


  const red = [
    "failed",
    "cancelled",
    "rejected",
    "inactive",
    "deactivated"
  ];


  const amber = [
    "pending",
    "pending_confirmation",
    "unpaid",
    "submitted",
    "picking",
    "packed",
    "ready_for_delivery",
    "assigned",
    "picked_up",
    "delivering",
    "partially_refunded",
    "requested",
    "processing"
  ];


  let cls =
    "badge";


  if(green.includes(value)){
    cls += " badge-green";
  }
  else if(red.includes(value)){
    cls += " badge-red";
  }
  else if(amber.includes(value)){
    cls += " badge-amber";
  }


  return (
    `<span class="${cls}">`
    +
    escapeHtml(value)
    +
    `</span>`
  );

}

function getCurrentRegion(){

}


function getProductName(product){

    return "—";
  }

  return (
    product[
      `name_${appLanguage}`
    ]
    ||
    product.name_zh
    ||
    product.name_en
    ||
    product.product_code
    ||
    "—"
  );

}


function getVariantName(variant){

  if(!variant){
    return "—";
  }

  return (
    variant[
      `name_${appLanguage}`
    ]
    ||
    variant.name_zh
    ||
    variant[
      `specification_${appLanguage}`
    ]
    ||
    variant.specification_zh
    ||
    variant[
      `flavor_${appLanguage}`
    ]
    ||
    variant.flavor_zh
    ||
    variant.sku_code
  );

}


function getCategoryName(category){

  if(!category){
    return "—";
  }

  return (
    category[
      `name_${appLanguage}`
    ]
    ||
    category.name_zh
    ||
    category.name_en
    ||
    category.code
  );

}


function getRegionName(region){

  if(!region){
    return "—";
  }

  return (
    region[
      `name_${appLanguage}`
    ]
    ||
    region.name_zh
    ||
    region.name_en
    ||
    region.code
  );

}


function productEmoji(product){

  const category =
    categoryMap[
      product?.category_id
    ];

  return (
    category?.icon
    ||
    "🍪"
  );

}


function productImageUrl(productId){

  const images =
    imageMap[
      productId
    ]
    ||
    [];


  const primary =
    images.find(
      item =>
        item.is_primary
    )
    ||
    images[0];


  if(primary?.image_url){
    return primary.image_url;
  }


  return (
    productMap[
      productId
    ]?.image_url
    ||
    ""
  );

}


function inventoryForVariant(
  variantId
){

  return inventoryMap[
    `${selectedRegionId}:${variantId}`
  ]
  ||
  null;

}


function availableQty(
  variantId
){

  const inv =
    inventoryForVariant(
      variantId
    );


  if(!inv){
    return 0;
  }


  return Math.max(
    0,
    Number(
      inv.stock_on_hand
      ||
      0
    )
    -
    Number(
      inv.reserved_quantity
      ||
      0
    )
  );

}


/* ==========================================================
   LOAD PUBLIC DATA
========================================================== */

async function loadPublicData(){

  const results =
    await Promise.all([

      db
        .from("regions")
        .select("*")
        .eq("is_active",true)
        .order("sort_order"),

      db
        .from("categories")
        .select("*")
        .eq("is_active",true)
        .order("level")
        .order("sort_order"),

      db
        .from("products")
        .select("*")
        .eq("status","active")
        .order("sort_order"),

      db
        .from("product_variants")
        .select("*")
        .eq("is_active",true)
        .order("sort_order"),

      db
        .from("product_images")
        .select("*")
        .eq("is_active",true)
        .order("sort_order"),

      db
        .from("region_inventory")
        .select("*")

    ]);


  const firstError =
    results.find(
      item =>
        item.error
    );


  if(firstError){

    console.error(
      firstError.error
    );

    el("productGrid")
      .innerHTML =
      emptyState(
        t("networkError"),
        "⚠️"
      );

    return;

  }


  regions =
    results[0].data
    ||
    [];

  categories =
    results[1].data
    ||
    [];

  products =
    results[2].data
    ||
    [];

  variants =
    results[3].data
    ||
    [];

  productImages =
    results[4].data
    ||
    [];

  inventory =
    results[5].data
    ||
    [];


  if(
    !selectedRegionId
    ||
    !regions.some(
      item =>
        item.id
        ===
        selectedRegionId
    )
  ){

    selectedRegionId =
      regions[0]?.id
      ||
      null;


    if(selectedRegionId){

      localStorage.setItem(
        "mallRegionId",
        selectedRegionId
      );

    }

  }


  rebuildMaps();

  renderPublic();

}


/* ==========================================================
   MAPS
========================================================== */

function rebuildMaps(){

  regionMap = {};
  categoryMap = {};
  productMap = {};
  variantMap = {};
  imageMap = {};
  inventoryMap = {};


  regions.forEach(
    item => {

      regionMap[
        item.id
      ] =
        item;

    }
  );


  categories.forEach(
    item => {

      categoryMap[
        item.id
      ] =
        item;

    }
  );


  products.forEach(
    item => {

      productMap[
        item.id
      ] =
        item;

    }
  );


  variants.forEach(
    item => {

      variantMap[
        item.id
      ] =
        item;

    }
  );


  productImages.forEach(
    item => {

      if(
        !imageMap[
          item.product_id
        ]
      ){

        imageMap[
          item.product_id
        ] = [];

      }


      imageMap[
        item.product_id
      ]
      .push(item);

    }
  );


  inventory.forEach(
    item => {

      inventoryMap[
        `${item.region_id}:${item.variant_id}`
      ] =
        item;

    }
  );

}


/* ==========================================================

========================================================== */

function goView(
  viewName,
  navButton = null
){

  document
    .querySelectorAll(
      ".view"
    )
    .forEach(
      view =>
        view.classList
          .remove("active")
    );


  el(viewName)
    .classList
    .add("active");


  document
    .querySelectorAll(
      ".nav-item"
    )
    .forEach(
      button =>
        button.classList
          .remove("active")
    );


  if(navButton){

    navButton.classList
      .add("active");

  }
  else{

    const matching =
      document.querySelector(
        `.nav-item[data-view="${viewName}"]`
      );


    if(matching){

      matching.classList
        .add("active");

    }

  }


  window.scrollTo(
    {
      top:0,
      behavior:"smooth"
    }
  );


  if(
    viewName
    ===
    "cart"
  ){

    renderCart();

  }


  if(
    viewName
    ===
    "orders"
  ){

    loadOrders();

  }


  if(
    viewName
    ===
    "account"
  ){

    renderAccount();

  }

}

function childCategoryIds(
  parentId
){

  return categories
    .filter(
      item =>
        item.parent_id
        ===
        parentId
    )
    .map(
      item =>
        item.id
    );

}


function productHasRegionStock(
  productId
){

  const productVariants =
    variants
      .filter(
        variant =>
          variant.product_id
          ===
          productId
      );


  return productVariants
    .some(
      variant =>
        availableQty(
          variant.id
        )
        >
        0
    );

}


function applyProductFilters(){

  const search =
    (
      el("searchInput")
        ?.value
      ||
      ""
    )
    .trim()
    .toLowerCase();


  const categoryIds =
    selectedCategoryId
    ?
    [
      selectedCategoryId,
      ...childCategoryIds(
        selectedCategoryId
      )
    ]
    :
    null;


  const filtered =
    products
      .filter(
        product => {

          if(
            categoryIds
            &&
            !categoryIds.includes(
              product.category_id
            )
          ){

            return false;

          }


          if(search){

            const text = [
              product.name_zh,
              product.name_en,
              product.name_my,
              product.name_th,
              product.brand,
              product.product_code,
              product.description_zh,
              product.description_en
            ]
            .filter(Boolean)
            .join(" ")
            .toLowerCase();


            if(
              !text.includes(
                search
              )
            ){

              return false;

            }

          }


          return true;

        }
      );


  renderProducts(
    filtered
  );

}


function productMinimumPrice(
  productId
){

  const list =
    variants
      .filter(
        item =>
          item.product_id
          ===
          productId
      );


  if(
    list.length === 0
  ){

    return 0;

  }


  return Math.min(
    ...list.map(
      item =>
        Number(
          item.retail_price
          ||
          0
        )
    )
  );

}


function productWholesalePrice(
  productId
){

  const list =
    variants
      .filter(
        item =>
          item.product_id
          ===
          productId
        &&
        item.wholesale_price
        !==
        null
      );


  if(
    list.length === 0
  ){

    return null;

  }


  return Math.min(
    ...list.map(
      item =>
        Number(
          item.wholesale_price
        )
    )
  );

}


function productStockQty(
  productId
){

  return variants
    .filter(
      item =>
        item.product_id
        ===
        productId
    )
    .reduce(
      (
        sum,
        variant
      ) =>
        sum
        +
        availableQty(
          variant.id
        ),
      0
    );

}


function renderProducts(list){

  const region =
    getCurrentRegion();


  el("productSubtitle")
    .textContent =
    (
      region
      ?
      `${t("selectedRegion")}：${getRegionName(region)}`
      :
      t("chooseRegion")
    )
    +
    ` · ${list.length}`;


  if(
    list.length === 0
  ){

      .innerHTML =
      emptyState(
        t("noProducts"),
        "🛍️"
      );

  }


  el("productGrid")
    .innerHTML =
    list
      .map(
        product => {

          const image =
            productImageUrl(
              product.id
            );

          const price =
            productMinimumPrice(
              product.id
            );

          const wholesale =
            productWholesalePrice(
              product.id
            );

          const stock =
            productStockQty(
              product.id
            );


          return `

            <article class="product-card">

              <div
                class="product-image-wrap"
                onclick="openProduct('${product.id}')"
              >

                ${
                  image
                  ?

                  `

                  <img
                    class="product-image"
                    src="${escapeHtml(image)}"
                    alt="${escapeHtml(getProductName(product))}"
                    onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
                  >

                  <div
                    class="product-placeholder"
                    style="display:none"
                  >
                    ${escapeHtml(productEmoji(product))}
                  </div>

                  `

                  :

                  `

                  <div class="product-placeholder">

                    ${escapeHtml(productEmoji(product))}

                  </div>

                  `
                }


                ${
                  product.is_featured
                  ?

                  `

                  <span class="featured-tag">
                    HOT
                  </span>

                  `

                  :
                  ""
                }


                <span
                  class="stock-tag ${
                    stock <= 0
                    ?
                    "out"
                    :
                    ""
                  }"
                >

                  ${
                    stock > 0
                    ?
                    `${t("available")} ${stock}`
                    :
                    t("outOfStock")
                  }

                </span>

              </div>


              <div class="product-body">

                <div class="product-brand">

                  ${
                    escapeHtml(
                      product.brand
                      ||
                      product.origin_country
                      ||
                      ""
                    )
                  }

                </div>

                <div
                  class="product-name"
                  onclick="openProduct('${product.id}')"
                  style="cursor:pointer"
                >

                  ${
                    escapeHtml(
                      getProductName(
                        product
                      )
                    )
                  }

                </div>


                <div class="product-price">

                  ${money(price)}

                </div>


                <div class="product-wholesale">

                  ${
                    wholesale !== null
                    ?
                    `${t("wholesale")} ${money(wholesale)}`
                    :
                    "&nbsp;"
                  }

                </div>


                <div class="product-actions">

                  <button
                    class="btn btn-light btn-small"
                    onclick="openProduct('${product.id}')"
                  >
                    ${escapeHtml(t("productDetail"))}
                  </button>

                  <button
                    class="btn btn-primary btn-small"
                    onclick="quickAddProduct('${product.id}')"

                  >
                    +
                  </button>

                </div>

              </div>

            </article>

          `;

        }
      )
      .join("");

}

function openProduct(productId){

  currentProductId =
    productId;


  const list =
    variants
      .filter(
        item =>
          item.product_id
          ===
          productId
      );


  currentVariantId =
    list.find(
      variant =>
        availableQty(
          variant.id
        )
        >
        0
    )?.id
    ||
    list[0]?.id
    ||
    null;


  currentPurchaseMode =
    "retail";

  currentProductQty =
    1;


  renderProductDetail();

  goView(
    "productDetail"
  );

}

    productMap[
      currentProductId

    );

    availableQty(
      variant.id
    )

    0;

    variant.wholesale_price

    null;

    currentPurchaseMode
    ===
    "wholesale"
    &&
    !wholesaleAvailable
  ){

      "retail";

  }

    ?
    (
      currentPurchaseMode
      ===
      "wholesale"
      ?
      Number(
        variant.wholesale_price
        ||
        0
      )

        ||

            >

                product.origin_country

                ""

                )
              )
            }

                product[
                  `description_${appLanguage}`
                ]
                ||
                product.description_zh
                ||
                ""
              )

                .map(

                    <button
                      class="variant-chip ${

                        ===
                        currentVariantId
                        ?
                        "active"
                        :
                        ""
                      }"
                      onclick="selectVariant('${item.id}')"

                          getVariantName(
                            item
                          )
                        )
                      }

            }

          </div>


          ${

            ?

            <div class="purchase-mode">

              <div

                  "retail"
                  ?
                  "active"
                  :
                  ""
                }"

                      variant.sales_unit_zh

                      variant.sales_unit_code
                      ||

function selectVariant(
  variantId
){

  currentVariantId =
    variantId;

  currentPurchaseMode =
    "retail";

  currentProductQty =
    1;

  renderProductDetail();

}


function setPurchaseMode(mode){

  const variant =
    variantMap[
      currentVariantId
    ];


  if(!variant){
    return;
  }


  if(
    mode
    ===
    "wholesale"
    &&
    variant.wholesale_price
    ===
    null
  ){

    return;

  }


  currentPurchaseMode =
    mode;


  if(
    mode
    ===
    "wholesale"
  ){

    currentProductQty =
      Math.max(
        currentProductQty,
        Number(
          variant.wholesale_min_qty
          ||
          1
        )
      );

  }


  renderProductDetail();

}


function changeDetailQty(delta){

  const variant =
    variantMap[
      currentVariantId
    ];


  if(!variant){
    return;
  }


  const max =
    availableQty(
      variant.id
    );


  const min =
    currentPurchaseMode
    ===
    "wholesale"
    ?
    Number(
      variant.wholesale_min_qty
      ||
      1
    )
    :
    1;


  currentProductQty =
    Math.max(
      min,
      Math.min(
        max || min,
        currentProductQty
        +
        delta
      )
    );


  renderProductDetail();

}


function addCurrentProductToCart(){

  addVariantToCart(
    currentVariantId,
    currentPurchaseMode,
    currentProductQty
  );

}

function addVariantToCart(
  variantId,
  mode,
  quantity
){

  const variant =
    variantMap[
      variantId
    ];


  if(!variant){
    return;
  }


  const stock =
    availableQty(
      variantId
    );


  if(
    stock <= 0
  ){

    showMessage(
      t("soldOut")
    );

    return;

  }


  if(
    mode
    ===
    "wholesale"
  ){

    const min =
      Number(
        variant.wholesale_min_qty
        ||
        1
      );


    if(
      quantity < min
    ){

      showMessage(
        t("wholesaleMinimum")
      );

      return;

    }

  }


  const existing =
    localCart.find(
      item =>
        item.region_id
        ===
        selectedRegionId
      &&
        item.variant_id
        ===
        variantId
      &&
        item.purchase_mode
        ===
        mode
    );


  if(existing){

    existing.quantity =
      Math.min(
        stock,
        existing.quantity
        +
        quantity
      );

  }
  else{

    localCart.push({

      region_id:
        selectedRegionId,

      variant_id:
        variantId,

      purchase_mode:
        mode,

      quantity:
        Math.min(
          stock,
          quantity
        )

    });

  }


  saveLocalCart();

  renderCart();

  showMessage(
    t("productAdded")
  );

}


function currentRegionCart(){

  return localCart
    .filter(
      item =>
        item.region_id
        ===
        selectedRegionId
    );

}


function updateCartCount(){

  const count =
    currentRegionCart()
      .reduce(
        (
          sum,
          item
        ) =>
          sum
          +
          Number(
            item.quantity
            ||
            0
          ),
        0
      );


  [
    "topCartCount",
    "bottomCartCount"
  ]
  .forEach(
    id => {

      const node =
        el(id);


      if(!node){
        return;
      }


      node.textContent =
        count;


      node.classList
        .toggle(
          "hidden",
          count <= 0
        );

    }
  );

}


function cartItemPrice(item){

  const variant =
    variantMap[
      item.variant_id
    ];


  if(!variant){
    return 0;
  }


  return item.purchase_mode
    ===
    "wholesale"
    ?
    Number(
      variant.wholesale_price
      ||
      0
    )
    :
    Number(
      variant.retail_price
      ||
      0
    );

}


function cartSubtotal(){

  return currentRegionCart()
    .reduce(
      (
        sum,
        item
      ) =>
        sum
        +
        cartItemPrice(
          item
        )
        *
        Number(
          item.quantity
        ),
      0
    );

}

function changeCartQty(
  variantId,
  mode,
  delta
){

  const item =
    localCart.find(
      item =>
        item.region_id
        ===
        selectedRegionId
      &&
        item.variant_id
        ===
        variantId
      &&
        item.purchase_mode
        ===
        mode
    );


  if(!item){
    return;
  }


  const variant =
    variantMap[
      variantId
    ];


  const stock =
    availableQty(
      variantId
    );


  let min =
    1;


  if(
    mode
    ===
    "wholesale"
  ){

    min =
      Number(
        variant?.wholesale_min_qty
        ||
        1
      );

  }


  const next =
    item.quantity
    +
    delta;


  if(
    next < min
  ){

    if(
      confirm(
        t("cancelOrder")
        +
        "?"
      )
    ){

      removeCartItem(
        variantId,
        mode
      );

    }

    return;

  }


  item.quantity =
    Math.min(
      stock,
      next
    );


  saveLocalCart();

  renderCart();

}


function removeCartItem(
  variantId,
  mode
){

  localCart =
    localCart.filter(
      item =>
        !(
          item.region_id
          ===
          selectedRegionId
          &&
          item.variant_id
          ===
          variantId
          &&
          item.purchase_mode
          ===
          mode
        )
    );


  saveLocalCart();

  renderCart();

}

async function customerLogin(){

  const email =
    el("loginEmail")
      .value
      .trim();

  const password =
    el("loginPassword")
      .value;


  if(
    !email
    ||
    !password
  ){

    showAuthMessage(
      "Email / Password required."
    );

    return;

  }


  showAuthMessage(
    t("loading")
  );


  const {
    data,
    error
  } =
    await db.auth
      .signInWithPassword({

        email:
          email,

        password:
          password

      });

async function customerRegister(){

  const name =
    el("registerName")
      .value
      .trim();

  const phone =
    el("registerPhone")
      .value
      .trim();

  const email =
    el("registerEmail")
      .value
      .trim();

  const password =
    el("registerPassword")
      .value;

  const regionId =
    el("registerRegion")
      .value;


  if(
    !name
    ||
    !phone
    ||
    !email
    ||
    password.length < 8
    ||
    !regionId
  ){

    showAuthMessage(
      "Please complete all fields. Password minimum 8 characters."
    );

    return;

  }


  const {
    data,
    error
  } =
    await db.auth
      .signUp({

        email:
          email,

        password:
          password

      });


  if(error){

    showAuthMessage(
      error.message
    );

    return;

  }


  if(
    data.session
    &&
    data.user
  ){

    currentUser =
      data.user;


    const profileResult =
      await db
        .from(
          "customer_profiles"
        )
        .insert({

          id:
            data.user.id,

          full_name:
            name,

          phone:
            phone,

          default_region_id:
            regionId,

          preferred_language:
            appLanguage,

          status:
            "active"

        });


    if(
      profileResult.error
    ){

      showAuthMessage(
        profileResult.error.message
      );

      return;

    }


    closeAuthModal();

    await initializeCustomer();

    showMessage(
      t("registerSuccess")
    );

  }
  else{

    localStorage.setItem(
      "pendingCustomerProfile",
      JSON.stringify({

        full_name:
          name,

        phone:
          phone,

        default_region_id:
          regionId,

        preferred_language:
          appLanguage

      })
    );


    showAuthMessage(
      t("verifyEmail")
    );

  }

}

  } =

  if(
    data.session
  ){

    await initializeCustomer();

  }

}


/* ==========================================================
   CUSTOMER PROFILE
========================================================== */

async function initializeCustomer(){

  if(!currentUser){
    return;
  }


  const {
    data,
    error
  } =
    await db
      .from(
        "customer_profiles"
      )
      .select("*")
      .eq(
        "id",
        currentUser.id
      )
      .maybeSingle();


  if(error){

    console.error(error);

    return;

  }


  if(!data){

    const pending =
      localStorage.getItem(
        "pendingCustomerProfile"
      );


    if(pending){

      try{

        const profile =
          JSON.parse(
            pending
          );


        const {
          error:
          insertError
        } =
          await db
            .from(
              "customer_profiles"
            )
            .insert({

              id:
                currentUser.id,

              full_name:
                profile.full_name,

              phone:
                profile.phone,

              default_region_id:
                profile.default_region_id,

              preferred_language:
                profile.preferred_language
                ||
                appLanguage,

              status:
                "active"

            });


        if(!insertError){

          localStorage.removeItem(
            "pendingCustomerProfile"
          );

          return await initializeCustomer();

        }

      }
      catch{}

    }


    openProfileSetup();

    return;

  }


  customerProfile =
    data;


  if(
    customerProfile
      .preferred_language
  ){

    appLanguage =
      customerProfile
        .preferred_language;

    localStorage.setItem(
      "mallLanguage",
      appLanguage
    );

  }


  if(
    !selectedRegionId
    &&
    customerProfile
      .default_region_id
  ){

    selectedRegionId =
      customerProfile
        .default_region_id;

  }


  await Promise.all([

    loadAddresses(),
    loadOrders()

  ]);


  applyLanguage();

  renderPublic();

  renderAccount();

}

async function loadAddresses(){

  if(!currentUser){

    addresses = [];

    return;

  }


  const {
    data,
    error
  } =
    await db
      .from(
        "customer_addresses"
      )
      .select("*")
      .eq(
        "customer_id",
        currentUser.id
      )
      .eq(
        "is_active",
        true
      )
      .order(
        "is_default",
        {
          ascending:false
        }
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(error){

    console.error(error);

    return;

  }


  addresses =
    data
    ||
    [];


  if(
    !selectedCheckoutAddressId
  ){

    selectedCheckoutAddressId =
      addresses.find(
        item =>
          item.is_default
      )?.id
      ||
      addresses[0]?.id
      ||
      null;

  }

}


async function saveAddress(){

  if(!currentUser){

    openAuthModal();

    return;

  }


  const name =
    el("newAddressName")
      ?.value
      .trim();

  const phone =
    el("newAddressPhone")
      ?.value
      .trim();

  const regionId =
    el("newAddressRegion")
      ?.value;

  const detail =
    el("newAddressDetail")
      ?.value
      .trim();


  if(
    !name
    ||
    !phone
    ||
    !regionId
    ||
    !detail
  ){

    showMessage(
      "Please complete recipient, phone, region and detailed address."
    );

    return;

  }


  const isDefault =
    !!el("newAddressDefault")
      ?.checked;


  if(isDefault){

    await db
      .from(
        "customer_addresses"
      )
      .update({
        is_default:false
      })
      .eq(
        "customer_id",
        currentUser.id
      );

  }


  const {
    error
  } =
    await db
      .from(
        "customer_addresses"
      )
      .insert({

        customer_id:
          currentUser.id,

        recipient_name:
          name,

        phone:
          phone,

        region_id:
          regionId,

        township:
          el("newAddressTownship")
            ?.value
          ||
          null,

        street:
          el("newAddressStreet")
            ?.value
          ||
          null,

        detailed_address:
          detail,

        label:
          el("newAddressLabel")
            ?.value
          ||
          null,

        is_default:
          isDefault,

        is_active:
          true

      });


  if(error){

    showMessage(
      error.message
    );

    return;

  }


  await loadAddresses();

  showMessage(
    t("addressSaved")
  );


  if(
    document
      .getElementById("checkout")
      .classList
      .contains("active")
  ){

    renderCheckout();

  }
  else{

    renderAccount();

  }

}

async function syncCartToDatabase(){

  if(
    !currentUser
  ){

    throw new Error(
      "Not authenticated"
    );

  }


  const list =
    currentRegionCart();


  if(
    list.length === 0
  ){

    throw new Error(
      t("emptyCart")
    );

  }


  let {
    data:
    existingCarts,
    error:
    cartReadError
  } =
    await db
      .from("carts")
      .select("*")
      .eq(
        "customer_id",
        currentUser.id
      )
      .eq(
        "region_id",
        selectedRegionId
      )
      .eq(
        "status",
        "active"
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      )
      .limit(1);


  if(cartReadError){

    throw cartReadError;

  }


  let cart =
    existingCarts?.[0];


  if(!cart){

    const {
      data:
      newCart,
      error:
      createError
    } =
      await db
        .from("carts")
        .insert({

          customer_id:
            currentUser.id,

          region_id:
            selectedRegionId,

          status:
            "active"

        })
        .select()
        .single();


    if(createError){

      throw createError;

    }


    cart =
      newCart;

  }


  const {
    error:
    deleteError
  } =
    await db
      .from("cart_items")
      .delete()
      .eq(
        "cart_id",
        cart.id
      );


  if(deleteError){

    throw deleteError;

  }


  const rows =
    list.map(
      item => ({

        cart_id:
          cart.id,

        variant_id:
          item.variant_id,

        purchase_mode:
          item.purchase_mode,

        quantity:
          item.quantity

      })
    );


  const {
    error:
    insertError
  } =
    await db
      .from("cart_items")
      .insert(rows);


  if(insertError){

    throw insertError;

  }


  return cart;

}


async function placeOrder(){

  if(
    !currentUser
  ){

    openAuthModal();

    return;

  }


  const address =
    addresses.find(
      item =>
        item.id
        ===
        selectedCheckoutAddressId
    );


  if(!address){

    showMessage(
      t("chooseAddress")
    );

    return;

  }


  if(
    address.region_id
    !==
    selectedRegionId
  ){

    showMessage(
      t("regionMismatch")
    );

    return;

  }


  const button =
    el("checkoutSubmitButton");


  if(button){

    button.disabled =
      true;

    button.textContent =
      t("loading");

  }


  try{

    const cart =
      await syncCartToDatabase();


    const {
      data,
      error
    } =
      await db.rpc(
        "checkout_cart",
        {

          p_cart_id:
            cart.id,

          p_address_id:
            address.id,

          p_payment_method:
            el("checkoutPaymentMethod")
              .value,

          p_customer_note:
            el("checkoutNote")
              .value
            ||
            null

        }
      );


    if(error){

      throw error;

    }


    const result =
      Array.isArray(data)
      ?
      data[0]
      :
      data;


    if(
      !result
      ||
      !result.order_id
    ){

      throw new Error(
        "Order creation returned no order id."
      );

    }


    currentOrderId =
      result.order_id;


    localCart =
      localCart.filter(
        item =>
          item.region_id
          !==
          selectedRegionId
      );


    saveLocalCart();


    await loadOrders();


    el("checkoutContent")
      .innerHTML = `

        <div class="empty">

          <div class="empty-icon">
            ✅
          </div>

          <div
            style="
              font-size:19px;
              color:var(--text);
              font-weight:1000
            "
          >

            ${escapeHtml(t("orderSuccess"))}

          </div>


          <div style="margin-top:7px">

            ${escapeHtml(t("orderCreated"))}

          </div>


          <div
            style="
              margin-top:8px;
              color:var(--orange);
              font-weight:900
            "
          >

            ${
              escapeHtml(
                result.order_number
              )
            }

          </div>


          <div style="margin-top:7px">

            ${money(result.total_amount)}

          </div>


          <div style="margin-top:7px">

            ${escapeHtml(t("paymentPending"))}

          </div>


          <div style="margin-top:15px">

            <button
              class="btn btn-primary"
              onclick="openOrder('${result.order_id}')"
            >

              ${escapeHtml(t("viewOrder"))}

            </button>

          </div>

        </div>

      `;

  }
  catch(error){

    console.error(error);

    showMessage(
      error.message
      ||
      t("networkError")
    );

  }
  finally{

    if(button){

      button.disabled =
        false;

      button.textContent =
        t("placeOrder");

    }

  }

}

async function openOrder(
  orderId
){

  if(!currentUser){

    openAuthModal();

    return;

  }


  currentOrderId =
    orderId;


  goView(
    "orderDetail"
  );


  el("orderDetailContent")
    .innerHTML =
    emptyState(
      t("loading"),
      "⏳"
    );


  const results =
    await Promise.all([

      db
        .from("orders")
        .select("*")
        .eq(
          "id",
          orderId
        )
        .single(),

      db
        .from("order_items")
        .select(
          `
          id,
          order_id,
          product_id,
          variant_id,
          product_code_snapshot,
          sku_code_snapshot,
          product_name_zh_snapshot,
          product_name_en_snapshot,
          product_name_my_snapshot,
          product_name_th_snapshot,
          variant_name_zh_snapshot,
          variant_name_en_snapshot,
          variant_name_my_snapshot,
          variant_name_th_snapshot,
          specification_zh_snapshot,
          specification_en_snapshot,
          specification_my_snapshot,
          specification_th_snapshot,
          sales_unit_code_snapshot,
          units_per_case_snapshot,
          purchase_mode,
          quantity,
          unit_price,
          line_total,
          created_at
          `
        )
        .eq(
          "order_id",
          orderId
        ),

      db
        .from("order_status_history")
        .select("*")
        .eq(
          "order_id",
          orderId
        )
        .order(
          "created_at",
          {
            ascending:true
          }
        ),

      db
        .from("payment_transactions")
        .select("*")
        .eq(
          "order_id",
          orderId
        )
        .order(
          "created_at",
          {
            ascending:false
          }
        )

    ]);


  if(
    results[0].error
  ){

    el("orderDetailContent")
      .innerHTML =
      emptyState(
        results[0].error.message,
        "⚠️"
      );

    return;

  }


  const order =
    results[0].data;

  const items =
    results[1].data
    ||
    [];

  const history =
    results[2].data
    ||
    [];

  const payments =
    results[3].data
    ||
    [];


  renderOrderDetail(
    order,
    items,
    history,
    payments
  );

}

async function cancelCustomerOrder(
  orderId
){

  const reason =
    prompt(
      t("cancelReason")
    );


  if(!reason){
    return;
  }


  const {
    error
  } =
    await db.rpc(
      "cancel_order",
      {

        p_order_id:
          orderId,

        p_reason:
          reason

      }
    );


  if(error){

    showMessage(
      error.message
    );

    return;

  }


  await loadOrders();

  await openOrder(
    orderId
  );

}


async function submitPaymentProof(
  orderId
){

  const method =
    el("proofPaymentMethod")
      .value;

  const reference =
    el("paymentReference")
      .value
      .trim();

  const proofUrl =
    el("paymentProofUrl")
      .value
      .trim();


  if(
    !reference
    &&
    !proofUrl
  ){

    showMessage(
      "Payment reference or proof URL required."
    );

    return;

  }


  const {
    error
  } =
    await db.rpc(
      "submit_payment_proof",
      {

        p_order_id:
          orderId,

        p_payment_method:
          method,

        p_external_reference:
          reference
          ||
          null,

        p_proof_url:
          proofUrl
          ||
          null

      }
    );


  if(error){

    showMessage(
      error.message
    );

    return;

  }


  showMessage(
    t("paymentSubmitted")
  );


  await loadOrders();

  await openOrder(
    orderId
  );

}

              ${
                escapeHtml(
                  currentUser.email
                  ||
                  ""
                )
              }

            </div>

          </div>

        </div>


        ${statusBadge(customerProfile.status)}

      </div>


      <div class="form-card">

        <div class="form-title">

          ${escapeHtml(t("profile"))}

        </div>


        <div class="form-grid">

          <div class="form-group">

            <label>
              ${escapeHtml(t("fullName"))}
            </label>

            <input
              id="accountName"
              value="${escapeHtml(customerProfile.full_name)}"
            >

          </div>


          <div class="form-group">

            <label>
              ${escapeHtml(t("phone"))}
            </label>

            <input
              id="accountPhone"
              value="${escapeHtml(customerProfile.phone)}"
            >

          </div>


          <div class="form-group">

            <label>
              ${escapeHtml(t("defaultRegion"))}
            </label>

            <select id="accountRegion">

              ${regionOptions}

            </select>

          </div>


          <div class="form-group">

            <label>
              Language
            </label>

            <select id="accountLanguage">

              <option
                value="zh"
                ${
                  customerProfile.preferred_language
                  ===
                  "zh"
                  ?
                  "selected"
                  :
                  ""
                }
              >
                中文
              </option>

              <option
                value="en"
                ${
                  customerProfile.preferred_language
                  ===
                  "en"
                  ?
                  "selected"
                  :
                  ""
                }
              >
                English
              </option>

              <option
                value="my"
                ${
                  customerProfile.preferred_language
                  ===
                  "my"
                  ?
                  "selected"
                  :
                  ""
                }
              >
                မြန်မာ
              </option>

              <option
                value="th"
                ${
                  customerProfile.preferred_language
                  ===
                  "th"
                  ?
                  "selected"
                  :
                  ""
                }
              >
                ไทย
              </option>

            </select>

          </div>

        </div>


        <button
          class="btn btn-primary"
          onclick="updateProfile()"
        >

          ${escapeHtml(t("editProfile"))}

        </button>

      </div>


      <div class="form-card">

        <div class="form-title">

          ${escapeHtml(t("address"))}

        </div>


        ${renderAccountAddresses()}

      </div>


      <button
        class="btn btn-red btn-block"
        onclick="logoutCustomer()"
      >

        ${escapeHtml(t("logout"))}

      </button>

    `;

}


function renderAccountAddresses(){

  if(
    addresses.length === 0
  ){

    return `

      <div class="empty">

        ${escapeHtml(t("noAddress"))}

      </div>

      <div style="margin-top:10px">

        <button
          class="btn btn-primary"
          onclick="startCheckout()"
        >

          ${escapeHtml(t("addAddress"))}

        </button>

      </div>

    `;

  }


  return addresses
    .map(
      address => `

        <div
          class="address-card"
          style="margin-bottom:7px"
        >

          <div class="address-head">

            <div class="address-name">

              ${
                escapeHtml(
                  address.recipient_name
                )
              }

              ·

              ${
                escapeHtml(
                  address.phone
                )
              }

            </div>

            ${
              address.is_default
              ?

              `<span class="default-badge">DEFAULT</span>`

              :
              ""
            }

          </div>


          <div class="address-detail">

            ${
              escapeHtml(
                getRegionName(
                  regionMap[
                    address.region_id
                  ]
                )
              )
            }

            <br>

            ${
              escapeHtml(
                address.detailed_address
              )
            }

          </div>

        </div>

      `
    )
    .join("");

}


async function updateProfile(){

  const name =
    el("accountName")
      .value
      .trim();

  const phone =
    el("accountPhone")
      .value
      .trim();

  const regionId =
    el("accountRegion")
      .value;

  const language =
    el("accountLanguage")
      .value;


  if(
    !name
    ||
    !phone
    ||
    !regionId
  ){

    return;

  }


  const {
    error
  } =
    await db
      .from(
        "customer_profiles"
      )
      .update({

        full_name:
          name,

        phone:
          phone,

        default_region_id:
          regionId,

        preferred_language:
          language,

        updated_at:
          new Date()
            .toISOString()

      })
      .eq(
        "id",
        currentUser.id
      );


  if(error){

    showMessage(
      error.message
    );

    return;

  }


  appLanguage =
    language;

  localStorage.setItem(
    "mallLanguage",
    language
  );


  await initializeCustomer();

  showMessage(
    t("profileSaved")
  );

}


/* ==========================================================
   EMPTY
========================================================== */

function emptyState(
  message,
  icon = "📦"
){

  return `

    <div class="empty">

      <div class="empty-icon">

        ${icon}

      </div>

      ${escapeHtml(message)}

    </div>

  `;

}


/* ==========================================================
   AUTH LISTENER
========================================================== */

db.auth.onAuthStateChange(
  (
    event,
    session
  ) => {

    if(
      event
      ===
      "SIGNED_OUT"
    ){

      currentUser =
        null;

      customerProfile =
        null;

      addresses = [];

      orders = [];

      renderAccount();

      renderOrders();

    }


    if(
      event
      ===
      "SIGNED_IN"
      &&
      session?.user
    ){

      currentUser =
        session.user;

    }

  }
);


/* ==========================================================
   INIT
========================================================== */

async function initialize(){

  applyLanguage();

  updateCartCount();


  el("productGrid")
    .innerHTML =
    emptyState(
      t("loading"),
      "⏳"
    );


  await loadPublicData();

  await checkSession();

  renderAll();

}


initialize();

</script>

</body>
</html>
